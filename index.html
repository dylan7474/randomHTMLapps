<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>randomHTMLapps</title>
<meta name="description" content="A compendium of standalone single-file HTML apps: games, simulations and audio tools.">
<style>
  :root{
    --bg:#0f1220; --card:#181c30; --card-hover:#20253f; --text:#e8eaf6; --muted:#9aa1c4;
    --accent:#6ea8ff; --border:#2a3050;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f5fb; --card:#fff; --card-hover:#eef1ff; --text:#1a1d33; --muted:#5b6285; --accent:#2f5fd0; --border:#d9ddf0; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header,main,footer{max-width:1100px;margin:0 auto;padding:0 16px}
  header{padding-top:40px;padding-bottom:8px}
  h1{margin:0 0 4px;font-size:2rem}
  header p{margin:0;color:var(--muted)}
  .tools{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}
  input[type=search]{flex:1 1 220px;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit}
  .chip{padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit;cursor:pointer}
  .chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
  input:focus-visible,.chip:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  h2{font-size:1.1rem;margin:28px 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  a.card{display:block;padding:14px 16px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:inherit;text-decoration:none}
  a.card:hover{background:var(--card-hover);border-color:var(--accent)}
  .card b{display:block;font-size:1.05rem;color:var(--accent)}
  .card span{display:block;font-size:.9rem;color:var(--muted);margin-top:4px}
  .card small{display:inline-block;margin-top:8px;font-size:.75rem;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:0 6px}
  #empty{display:none;color:var(--muted);margin-top:24px}
  footer{padding-top:32px;padding-bottom:40px;color:var(--muted);font-size:.9rem}
  footer a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>randomHTMLapps</h1>
  <p>A compendium of standalone browser apps. Each one is a single HTML file, with no install and no build.</p>
</header>
<main>
  <div class="tools">
    <input type="search" id="q" placeholder="Search apps…" aria-label="Search apps">
    <span id="chips" style="display:contents"></span>
  </div>
  <div id="list"></div>
  <p id="empty">No apps match.</p>
</main>
<footer>
  Source and notes on <a href="https://github.com/dylan7474/randomHTMLapps">GitHub</a>.
  Microphone apps will ask for permission.
</footer>
<script>
// To add an app: add one line here. Categories are shown in this order.
const CATS = ["Games","Simulations","Audio & speech"];
const APPS = [
  ["breakout.html","Neon Breakout","Brick-breaker with levels, power-ups and glowing arcade visuals.","Games"],
  ["galaxians.html","Galaxian Clone","Fixed-screen space shooter with dive attacks and touch controls.","Games"],
  ["vaders.html","Space Invaders","Classic invader defence with escalating pressure.","Games"],
  ["lander.html","Lunar Lander","Manage angle, thrust and fuel to touch down safely.","Games"],
  ["pacman.html","Maze Muncher","Pac-Man-style maze game with power pellets and ghost AI.","Games"],
  ["pool.html","Emerald Pocket Pro","Top-down pool with cue aiming, power and English spin.","Games"],
  ["pennyfalls.html","Neon Penny Falls 3D","3D coin-pusher with physics and WebGL.","Games"],
  ["ComputerBattleship.html","Neon Fleet: Tactical Command","Battleship against the computer.","Games"],
  ["FishTank.html","Tropical Fish: Pro Aquarium","A tropical aquarium to watch.","Simulations"],
  ["NebularHypothesisSimulation.html","Stellar Genesis","N-body accretion: watch planets form from a nebula.","Simulations"],
  ["EntropyWordGenerator.html","Stellar Formation Simulation","Entropy-driven word generator and stellar formation sim.","Simulations"],
  ["SparkGapSimulator.html","Frankenstein Spark Gap Transmitter","Mad-science spark gap with dials, switches and sparks.","Simulations"],
  ["cuckooclock.html","Chalet Cuckoo Clock","Animated clockwork with pendulum, cuckoo and chimes.","Simulations"],
  ["voicescribe.html","VoxScribe","Speech-to-text with editable transcript, copy and download.","Audio & speech"],
  ["chatter.html","VoxScribe Premium","Conversation-style speech UI with optional local AI.","Audio & speech"],
  ["FrequencyDetector.html","FreqHunter Quantum","Real-time microphone spectrum and signal dashboard.","Audio & speech"],
  ["sonicradar.html","Active Acoustic Sensing","Acoustic sensing and calibration with sound.","Audio & speech"],
  ["sleep.html","Lumen Slumber","Ambient visuals and sound for relaxing, focus or sleep.","Audio & speech"],
];
const list=document.getElementById("list"), q=document.getElementById("q"),
      chips=document.getElementById("chips"), empty=document.getElementById("empty");
let cat="All";
["All",...CATS].forEach(c=>{
  const b=document.createElement("button");
  b.className="chip"; b.textContent=c; b.setAttribute("aria-pressed",c===cat);
  b.onclick=()=>{cat=c;[...chips.children].forEach(x=>x.setAttribute("aria-pressed",x===b));render()};
  chips.appendChild(b);
});
function render(){
  const t=q.value.trim().toLowerCase(); let n=0; list.textContent="";
  CATS.forEach(c=>{
    if(cat!=="All"&&cat!==c) return;
    const rows=APPS.filter(a=>a[3]===c&&(a[1]+" "+a[2]+" "+a[0]).toLowerCase().includes(t));
    if(!rows.length) return;
    n+=rows.length;
    const h=document.createElement("h2"); h.textContent=c;
    const g=document.createElement("div"); g.className="grid";
    rows.forEach(([f,name,desc])=>{
      const a=document.createElement("a"); a.className="card"; a.href=f;
      const b=document.createElement("b"); b.textContent=name;
      const s=document.createElement("span"); s.textContent=desc;
      const m=document.createElement("small"); m.textContent=f;
      a.append(b,s,m); g.appendChild(a);
    });
    list.append(h,g);
  });
  empty.style.display=n?"none":"block";
}
q.addEventListener("input",render); render();
</script>
</body>
</html>
