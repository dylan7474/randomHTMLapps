<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tropical Fish - Pro Aquarium</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #041f2e;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        canvas {
            display: block;
            touch-action: none;
        }

        body.feeding canvas {
            cursor: crosshair;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 3px;
            font-weight: 300;
        }

        .controls-hint {
            font-size: 14px;
            opacity: 0.7;
            margin-top: 5px;
        }

        #interaction-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            background: rgba(0, 20, 40, 0.6);
            backdrop-filter: blur(15px);
            padding: 12px 25px;
            border-radius: 50px;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
            width: max-content;
            max-width: 90vw;
        }

        button {
            background: rgba(0, 188, 212, 0.3);
            border: 1px solid rgba(0, 188, 212, 0.5);
            padding: 8px 16px;
            border-radius: 20px;
            color: #e0f7fa;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            outline: none;
            font-size: 13px;
        }

        button:hover:not(:disabled) {
            background: rgba(0, 188, 212, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:focus-visible {
            box-shadow: 0 0 0 2px #e0f7fa;
        }

        button:disabled {
            opacity: 0.4;
            cursor: default;
        }

        #feed-btn {
            background: rgba(255, 152, 0, 0.3);
            border-color: rgba(255, 152, 0, 0.5);
        }
        #feed-btn:hover:not(:disabled), body.feeding #feed-btn {
            background: rgba(255, 152, 0, 0.6);
        }

        #feed-msg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.7);
            pointer-events: none;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0,0,0,1);
            opacity: 0;
            transition: opacity 0.6s;
        }

        body.feeding #feed-msg.show {
            opacity: 1;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

    <div id="ui-layer">
        <h1>TROPICAL FISH</h1>
        <div class="controls-hint">Drag to look • Scroll or pinch to zoom • Feed Tank, then tap the water</div>
    </div>

    <div id="feed-msg">Tap the water to drop food</div>

    <div id="interaction-overlay">
        <button id="add-fish">+ Fish</button>
        <button id="add-crab">+ Crab</button>
        <button id="add-jelly">+ Jellyfish</button>
        <button id="feed-btn">Feed Tank</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
        import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

        // ------------------------------------------------------------------
        // Tank layout
        // ------------------------------------------------------------------
        const FLOOR_Y = -8;
        const SURFACE_Y = 11;
        const TANK = { x: 16, z: 16, yMin: -6, yMax: 7.5 };
        const MAX = { fish: 80, crabs: 12, jellies: 10 };
        const CAM = { minDist: 5, maxDist: 26, maxY: 7.5, minY: -6 };

        const WATER_COLOR = 0x0d5873;
        const FISH_L = 0.6; // world half-length of a size-1 fish

        const UP = new THREE.Vector3(0, 1, 0);
        const X_AXIS = new THREE.Vector3(1, 0, 0);

        // ------------------------------------------------------------------
        // Small helpers
        // ------------------------------------------------------------------
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const lerp = (a, b, t) => a + (b - a) * t;
        const smooth = (e0, e1, v) => { const t = clamp((v - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
        const wrapAngle = (a) => Math.atan2(Math.sin(a), Math.cos(a));
        // Frame-rate independent smoothing factor
        const damp = (rate, dt) => 1 - Math.exp(-rate * dt);
        const rand = (a = 0, b = 1) => a + Math.random() * (b - a);

        // Seeded RNG so the scenery is the same on every load
        function mulberry32(seed) {
            return function () {
                seed = (seed + 0x6D2B79F5) | 0;
                let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }
        const srng = mulberry32(7474);
        const srand = (a = 0, b = 1) => a + srng() * (b - a);

        function hash3(x, y, z) {
            let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1274126177);
            h = Math.imul(h ^ (h >>> 13), 1274126177);
            return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
        }

        function noise3(x, y, z) {
            const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
            const xf = x - xi, yf = y - yi, zf = z - zi;
            const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
            const c = (dx, dy, dz) => hash3(xi + dx, yi + dy, zi + dz);
            const x00 = lerp(c(0, 0, 0), c(1, 0, 0), u), x10 = lerp(c(0, 1, 0), c(1, 1, 0), u);
            const x01 = lerp(c(0, 0, 1), c(1, 0, 1), u), x11 = lerp(c(0, 1, 1), c(1, 1, 1), u);
            return lerp(lerp(x00, x10, v), lerp(x01, x11, v), w);
        }

        function fbm(x, y, z, octaves = 4) {
            let sum = 0, amp = 0.5, norm = 0;
            for (let i = 0; i < octaves; i++) {
                sum += amp * noise3(x, y, z);
                norm += amp;
                x *= 2.03; y *= 2.03; z *= 2.03;
                amp *= 0.5;
            }
            return sum / norm;
        }

        // Height of the sand at a point: gentle dunes plus fine ripples
        function floorY(x, z) {
            return FLOOR_Y
                + (fbm(x * 0.05 + 10, 0.5, z * 0.05 + 10, 3) - 0.5) * 2.0
                + Math.sin(x * 0.12) * Math.cos(z * 0.1) * 0.3
                + Math.sin(x * 1.3 + z * 0.5 + Math.sin(z * 0.2) * 3.0) * 0.05;
        }

        function makeCanvas(w, h) {
            const c = document.createElement('canvas');
            c.width = w;
            c.height = h;
            return c;
        }

        function canvasTexture(canvas, repeat = 1) {
            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(repeat, repeat);
            tex.anisotropy = 8;
            return tex;
        }

        // ------------------------------------------------------------------
        // Shader patches shared by the built-in materials
        //   swim     - travelling body wave + turn bend (fish)
        //   sway     - current-driven bending that grows with height (kelp, tentacles)
        //   caustics - dancing light pattern on upward-facing surfaces
        // ------------------------------------------------------------------
        const shared = { uTime: { value: 0 } };

        const CAUSTIC_GLSL = `
            float causticLayer(vec2 p, float t) {
                vec2 i = p;
                float c = 1.0;
                const float inten = 0.005;
                for (int n = 0; n < 4; n++) {
                    float tt = t * (1.0 - (3.5 / float(n + 1)));
                    i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
                    c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / inten), p.y / (cos(i.y + tt) / inten)));
                }
                c /= 4.0;
                c = 1.17 - pow(c, 1.4);
                return pow(abs(c), 8.0);
            }
        `;

        function patchMaterial(mat, opts) {
            const key = Object.keys(opts).sort().join('+');
            mat.customProgramCacheKey = () => 'tank:' + key;
            mat.onBeforeCompile = (shader) => {
                shader.uniforms.uTime = shared.uTime;
                let vHead = 'uniform float uTime;\n', vBody = '', vPost = '';
                let fHead = '', fPost = '';

                if (opts.swim) {
                    Object.assign(shader.uniforms, opts.swim);
                    vHead += 'uniform float uSwimPhase; uniform float uSwimAmp; uniform float uBend;\n';
                    vBody += `
                        float swW = clamp((0.3 - position.x) / 1.3, 0.0, 1.5);
                        transformed.z += sin(uSwimPhase - position.x * 3.2) * uSwimAmp * swW * swW;
                        float swB = min(position.x - 0.62, 0.0);
                        transformed.z += uBend * swB * swB;
                    `;
                }

                if (opts.sway) {
                    Object.assign(shader.uniforms, opts.sway);
                    vHead += 'uniform float uSwayAmp; uniform float uSwaySpeed; uniform float uSwayDir;\n';
                    vBody += `
                        #ifdef USE_INSTANCING
                            mat4 swM = modelMatrix * instanceMatrix;
                        #else
                            mat4 swM = modelMatrix;
                        #endif
                        float swH = max(position.y * uSwayDir, 0.0) * length(swM[1].xyz);
                        float swK = pow(swH, 1.5) * uSwayAmp;
                        float swP = uTime * uSwaySpeed + swM[3].x * 0.37 + swM[3].z * 0.29;
                        transformed.x += sin(swP + swH * 0.6) * swK;
                        transformed.z += cos(swP * 0.83 + swH * 0.5) * swK * 0.6;
                    `;
                }

                if (opts.caustics) {
                    shader.uniforms.uCaustic = { value: opts.caustics };
                    vHead += 'varying vec3 vCWorld; varying vec3 vCNormal;\n';
                    vPost += `
                        vec4 cwp = vec4(transformed, 1.0);
                        #ifdef USE_INSTANCING
                            cwp = instanceMatrix * cwp;
                        #endif
                        vCWorld = (modelMatrix * cwp).xyz;
                        vCNormal = normalize(mat3(modelMatrix) * objectNormal);
                    `;
                    fHead += 'uniform float uTime; uniform float uCaustic; varying vec3 vCWorld; varying vec3 vCNormal;\n' + CAUSTIC_GLSL;
                    fPost += `
                        {
                            vec2 cp = vCWorld.xz * 0.55 - 250.0;
                            float cz = causticLayer(cp, uTime * 0.5);
                            float cUp = clamp(normalize(vCNormal).y, 0.0, 1.0);
                            gl_FragColor.rgb += diffuseColor.rgb * vec3(0.8, 1.0, 1.0) * min(cz, 1.6) * cUp * uCaustic;
                        }
                    `;
                }

                shader.vertexShader = vHead + shader.vertexShader
                    .replace('#include <begin_vertex>', '#include <begin_vertex>\n' + vBody)
                    .replace('#include <project_vertex>', '#include <project_vertex>\n' + vPost);
                if (fHead) {
                    shader.fragmentShader = fHead + shader.fragmentShader
                        .replace('#include <tonemapping_fragment>', fPost + '\n#include <tonemapping_fragment>');
                }
            };
            return mat;
        }

        const swayUniforms = (amp, speed, dir = 1) => ({
            uSwayAmp: { value: amp },
            uSwaySpeed: { value: speed },
            uSwayDir: { value: dir }
        });

        // ------------------------------------------------------------------
        // Globals
        // ------------------------------------------------------------------
        let scene, camera, renderer, composer, bloomPass, clock, bgSphere, snowMaterial;
        const fishes = [];
        const crabs = [];
        const jellyfishes = [];
        const food = [];
        const obstacles = [];   // { c: Vector3, r } spheres fish steer around
        const rays = [];
        const bubbleSources = [];
        const bubbles = [];
        const bubblePool = [];
        let anemoneHome = null;
        let feedingMode = false;

        // Start at full quality and step down (MSAA, then bloom, then resolution) on slower GPUs
        const quality = { ratio: Math.min(window.devicePixelRatio, 2), minRatio: 0.6, msaa: true, frames: 0, time: -1.5 };

        const cam = { rotX: 0.05, rotY: 0, tRotX: 0.05, tRotY: 0, dist: 17, tDist: 17, lastInteract: 0 };

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(WATER_COLOR, 0.028);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1200);

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
            renderer.setPixelRatio(quality.ratio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.05;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFShadowMap;
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            createWaterAndLight();
            createFloor();
            createRocks();
            createCorals();
            createAnemone();
            createKelp();
            createLightShafts();
            createSurface();
            createMarineSnow();
            createBubbleSources();

            for (const key of Object.keys(SPECIES)) {
                for (let i = 0; i < SPECIES[key].count; i++) addFish(key);
            }
            for (let i = 0; i < 4; i++) addCrab();
            for (let i = 0; i < 3; i++) addJellyfish();

            setupPostProcessing();
            setupInput();

            window.addEventListener('resize', onWindowResize);
            renderer.setAnimationLoop(animate);
        }

        // ------------------------------------------------------------------
        // Water colour, background, lighting
        // ------------------------------------------------------------------
        function makeGradientMaterial(boost) {
            return new THREE.ShaderMaterial({
                side: THREE.BackSide,
                depthWrite: false,
                uniforms: {
                    uHorizon: { value: new THREE.Color(WATER_COLOR) },
                    uTop: { value: new THREE.Color(0x4fb8d0) },
                    uDeep: { value: new THREE.Color(0x03202e) },
                    uSun: { value: new THREE.Color(0x9ee8ff) },
                    uSunDir: { value: new THREE.Vector3(0.3, 1, 0.2).normalize() },
                    uBoost: { value: boost }
                },
                vertexShader: `
                    varying vec3 vDir;
                    void main() {
                        vDir = normalize(position);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform vec3 uHorizon, uTop, uDeep, uSun, uSunDir;
                    uniform float uBoost;
                    varying vec3 vDir;
                    void main() {
                        vec3 d = normalize(vDir);
                        vec3 c = mix(uHorizon, uTop, smoothstep(0.0, 0.85, d.y));
                        c = mix(c, uDeep, 1.0 - smoothstep(-0.7, -0.12, d.y));
                        c += uSun * pow(max(dot(d, uSunDir), 0.0), 6.0) * 0.5;
                        gl_FragColor = vec4(c * uBoost, 1.0);
                    }
                `
            });
        }

        function createWaterAndLight() {
            // Background dome: bright towards the surface, fading to the fog colour
            bgSphere = new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), makeGradientMaterial(1.0));
            bgSphere.renderOrder = -1;
            scene.add(bgSphere);

            // Soft reflections so glossy eyes, scales and wet rock pick up the water colour
            const envScene = new THREE.Scene();
            envScene.add(new THREE.Mesh(new THREE.SphereGeometry(10, 32, 16), makeGradientMaterial(2.2)));
            const pmrem = new THREE.PMREMGenerator(renderer);
            scene.environment = pmrem.fromScene(envScene, 0.04).texture;
            scene.environmentIntensity = 0.55;
            pmrem.dispose();

            scene.add(new THREE.HemisphereLight(0x9fdcff, 0x3a4a50, 1.1));

            const sun = new THREE.DirectionalLight(0xfff8ec, 2.0);
            sun.position.set(12, 36, 8);
            sun.castShadow = true;
            sun.shadow.mapSize.set(2048, 2048);
            const sc = sun.shadow.camera;
            sc.left = -26; sc.right = 26; sc.top = 26; sc.bottom = -26;
            sc.near = 5; sc.far = 80;
            sun.shadow.bias = -0.0005;
            sun.shadow.normalBias = 0.03;
            scene.add(sun);
        }

        // ------------------------------------------------------------------
        // Sand floor
        // ------------------------------------------------------------------
        function makeSandTexture() {
            const S = 256;
            const c = makeCanvas(S, S);
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#bba986';
            ctx.fillRect(0, 0, S, S);

            // Scattered darker/lighter grains, wrapped so the tile is seamless
            for (let i = 0; i < 900; i++) {
                const x = srand(0, S), y = srand(0, S), r = srand(0.6, 2.2);
                const l = srand(0.55, 1.2);
                ctx.fillStyle = `rgb(${205 * l | 0},${187 * l | 0},${150 * l | 0})`;
                for (const [ox, oy] of [[0, 0], [S, 0], [-S, 0], [0, S], [0, -S]]) {
                    ctx.beginPath();
                    ctx.arc(x + ox, y + oy, r, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            const img = ctx.getImageData(0, 0, S, S);
            for (let i = 0; i < img.data.length; i += 4) {
                const k = 0.88 + srng() * 0.24;
                img.data[i] *= k;
                img.data[i + 1] *= k;
                img.data[i + 2] *= k;
            }
            ctx.putImageData(img, 0, 0);
            return canvasTexture(c, 26);
        }

        function createFloor() {
            const size = 140, seg = 160;
            const geo = new THREE.PlaneGeometry(size, size, seg, seg);
            geo.rotateX(-Math.PI / 2);
            const pos = geo.attributes.position;
            const colors = new Float32Array(pos.count * 3);
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i), z = pos.getZ(i);
                pos.setY(i, floorY(x, z));
                // Large, soft light/dark patches so the sand doesn't look tiled
                const n = fbm(x * 0.08, 3.7, z * 0.08, 3);
                const k = 0.55 + n * 0.4;
                colors[i * 3] = k * 0.96;
                colors[i * 3 + 1] = k;
                colors[i * 3 + 2] = k;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.computeVertexNormals();

            const sand = makeSandTexture();
            const mat = patchMaterial(new THREE.MeshStandardMaterial({
                map: sand,
                bumpMap: sand,
                bumpScale: 1.5,
                vertexColors: true,
                roughness: 1.0
            }), { caustics: 1.4 });

            const floor = new THREE.Mesh(geo, mat);
            floor.receiveShadow = true;
            scene.add(floor);

            // Pebbles and shell fragments
            const pebbleGeo = new THREE.DodecahedronGeometry(1, 0);
            const pebbleMat = patchMaterial(new THREE.MeshStandardMaterial({ roughness: 0.9 }), { caustics: 1.0 });
            const pebbles = new THREE.InstancedMesh(pebbleGeo, pebbleMat, 320);
            const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
            const tint = new THREE.Color();
            for (let i = 0; i < pebbles.count; i++) {
                const a = srand(0, Math.PI * 2), r = srand(3, 30);
                const x = Math.cos(a) * r, z = Math.sin(a) * r;
                const sz = srand(0.05, 0.22);
                p.set(x, floorY(x, z) + sz * 0.2, z);
                q.setFromEuler(new THREE.Euler(srand(0, 3), srand(0, 3), srand(0, 3)));
                s.set(sz, sz * srand(0.4, 0.8), sz * srand(0.7, 1.2));
                m.compose(p, q, s);
                pebbles.setMatrixAt(i, m);
                const shell = srng() < 0.25;
                tint.setHSL(shell ? srand(0.05, 0.1) : srand(0.07, 0.12), shell ? 0.3 : 0.15, shell ? srand(0.7, 0.85) : srand(0.25, 0.5));
                pebbles.setColorAt(i, tint);
            }
            pebbles.castShadow = true;
            pebbles.receiveShadow = true;
            scene.add(pebbles);
        }

        // ------------------------------------------------------------------
        // Rocks
        // ------------------------------------------------------------------
        const rockMat = patchMaterial(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 }), { caustics: 1.0 });

        function makeRockGeometry(radius, detail, seed) {
            let g = new THREE.IcosahedronGeometry(1, detail);
            g.deleteAttribute('normal');
            g.deleteAttribute('uv');
            g = mergeVertices(g);
            const p = g.attributes.position;
            const v = new THREE.Vector3();
            const algae = srng() < 0.5
                ? new THREE.Color(0.05, 0.11, 0.03)      // green algae
                : new THREE.Color(0.3, 0.08, 0.12);      // pink coralline
            const colors = new Float32Array(p.count * 3);
            for (let i = 0; i < p.count; i++) {
                v.fromBufferAttribute(p, i);
                const n = fbm(v.x * 1.2 + seed, v.y * 1.2, v.z * 1.2 - seed, 4);
                const bump = fbm(v.x * 4 + seed, v.y * 4, v.z * 4, 2);
                const fine = noise3(v.x * 11 + seed, v.y * 11, v.z * 11);
                v.multiplyScalar(radius * (0.6 + n * 0.75 + bump * 0.22 + fine * 0.06));
                v.y *= 0.65;
                p.setXYZ(i, v.x, v.y, v.z);

                const ny = v.clone().normalize().y;
                const shade = 0.05 + n * 0.08 + bump * 0.06 + fine * 0.03;
                const c = new THREE.Color(shade * 1.1, shade, shade * 0.85);
                c.lerp(algae, smooth(0.35, 0.85, ny) * (0.4 + bump * 0.6));
                colors[i * 3] = c.r;
                colors[i * 3 + 1] = c.g;
                colors[i * 3 + 2] = c.b;
            }
            g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            g.computeVertexNormals();
            return g;
        }

        function addRock(x, z, r) {
            const rock = new THREE.Mesh(makeRockGeometry(r, r > 1.2 ? 4 : 2, srand(0, 100)), rockMat);
            const y = floorY(x, z) - r * 0.2;
            rock.position.set(x, y, z);
            rock.rotation.y = srand(0, Math.PI * 2);
            rock.castShadow = true;
            rock.receiveShadow = true;
            scene.add(rock);
            obstacles.push({ c: new THREE.Vector3(x, y + r * 0.2, z), r: r * 0.95 });
            return rock;
        }

        function createRocks() {
            const spots = [
                [-9, -8, 3.2], [-6.3, -10.8, 2.4], [-11.8, -5, 2.0], [-7.5, -6.2, 1.3],
                [8, -9, 3.0], [10.8, -6, 2.2], [6, -12.2, 2.0],
                [0, -15, 3.5], [3.4, -16, 2.5], [-3.2, -14.5, 1.8],
                [12, 8, 2.6], [-13, 9, 2.8], [-4, 13.5, 2.0], [5, 14, 1.6],
                [-15, -1, 1.5], [15, 1, 1.8], [14.5, -3, 1.2]
            ];
            for (const [x, z, r] of spots) addRock(x, z, r);

            for (let i = 0; i < 16; i++) {
                const a = srand(0, Math.PI * 2), d = srand(7, 19);
                addRock(Math.cos(a) * d, Math.sin(a) * d, srand(0.3, 0.9));
            }

            // Bubble streams rise from a couple of the rocks
            bubbleSources.push(
                { pos: new THREE.Vector3(-9, floorY(-9, -8) + 1.6, -8), rate: 0.7, timer: 0 },
                { pos: new THREE.Vector3(10.8, floorY(10.8, -6) + 1.1, -6), rate: 1.1, timer: 0 }
            );
        }

        // ------------------------------------------------------------------
        // Corals and sea fans
        // ------------------------------------------------------------------
        function makeBranchCoralGeometry() {
            const parts = [];
            const q = new THREE.Quaternion();

            function branch(start, dir, len, rad, depth) {
                const g = new THREE.CylinderGeometry(rad * 0.72, rad, len, 7, 1);
                g.translate(0, len / 2, 0);
                q.setFromUnitVectors(UP, dir);
                g.applyQuaternion(q);
                g.translate(start.x, start.y, start.z);
                parts.push(g);

                const end = start.clone().addScaledVector(dir, len);
                if (depth === 0) {
                    const tip = new THREE.SphereGeometry(rad * 0.75, 7, 5);
                    tip.translate(end.x, end.y, end.z);
                    parts.push(tip);
                    return;
                }
                const n = srng() < 0.4 ? 3 : 2;
                for (let i = 0; i < n; i++) {
                    const d = dir.clone()
                        .add(new THREE.Vector3(srand(-1, 1), srand(-0.3, 0.3), srand(-1, 1)).multiplyScalar(0.75))
                        .add(new THREE.Vector3(0, 0.35, 0))
                        .normalize();
                    branch(end, d, len * srand(0.7, 0.85), rad * 0.72, depth - 1);
                }
            }

            branch(new THREE.Vector3(0, -0.2, 0), UP.clone(), 0.9, 0.2, 4);
            return mergeGeometries(parts);
        }

        function makeSeaFanTexture(color) {
            const S = 256;
            const c = makeCanvas(S, S);
            const ctx = c.getContext('2d');
            ctx.strokeStyle = color;
            ctx.lineCap = 'round';

            function br(x, y, ang, len, w, depth) {
                const x2 = x + Math.sin(ang) * len, y2 = y - Math.cos(ang) * len;
                ctx.lineWidth = w;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x2, y2);
                ctx.stroke();
                if (depth > 0) {
                    br(x2, y2, ang - srand(0.12, 0.45), len * srand(0.72, 0.9), w * 0.78, depth - 1);
                    br(x2, y2, ang + srand(0.12, 0.45), len * srand(0.72, 0.9), w * 0.78, depth - 1);
                }
            }
            br(S / 2, S, 0, 46, 7, 8);
            const tex = canvasTexture(c);
            tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
            return tex;
        }

        function createCorals() {
            const coralColors = [0xd98fb0, 0xc9ae7a, 0x9a86d9, 0xe0a070];
            const spots = [[4.8, -6.4], [-8.5, -3.2], [9.5, 4.2], [-10.5, 5.5], [2, -11.5], [-2.5, 10]];
            spots.forEach(([x, z], i) => {
                const mat = patchMaterial(new THREE.MeshStandardMaterial({ color: coralColors[i % coralColors.length], roughness: 0.75 }), { caustics: 0.8 });
                const coral = new THREE.Mesh(makeBranchCoralGeometry(), mat);
                const s = srand(0.9, 1.4);
                coral.scale.setScalar(s);
                coral.position.set(x, floorY(x, z), z);
                coral.rotation.y = srand(0, Math.PI * 2);
                coral.castShadow = true;
                coral.receiveShadow = true;
                scene.add(coral);
                obstacles.push({ c: new THREE.Vector3(x, coral.position.y + 1.2 * s, z), r: 1.3 * s });
            });

            const fanSpots = [[1.5, -12.8, '#b0457a'], [-12.5, 2.5, '#d9772b'], [11, -10.5, '#8a4fc9']];
            for (const [x, z, color] of fanSpots) {
                const geo = new THREE.PlaneGeometry(2.8, 2.8, 6, 8);
                geo.translate(0, 1.4, 0);
                const mat = patchMaterial(new THREE.MeshStandardMaterial({
                    map: makeSeaFanTexture(color),
                    alphaTest: 0.4,
                    side: THREE.DoubleSide,
                    roughness: 0.8
                }), { sway: swayUniforms(0.035, 0.8) });
                const fan = new THREE.Mesh(geo, mat);
                fan.position.set(x, floorY(x, z) - 0.1, z);
                fan.lookAt(0, fan.position.y, 0); // face the middle of the tank
                scene.add(fan);
            }
        }

        // ------------------------------------------------------------------
        // Bubble-tip anemone (the clownfish's home)
        // ------------------------------------------------------------------
        function createAnemone() {
            const x = -5.2, z = -4.8;
            const baseY = floorY(x, z);
            const group = new THREE.Group();
            group.position.set(x, baseY, z);

            const column = new THREE.Mesh(
                new THREE.CylinderGeometry(0.55, 0.75, 0.7, 20),
                new THREE.MeshStandardMaterial({ color: 0x8a6a4a, roughness: 0.8 })
            );
            column.position.y = 0.3;
            column.castShadow = true;
            group.add(column);

            // Tentacle with a bulb near the tip, coloured pale at the base to pink at the tip
            const tGeo = new THREE.CylinderGeometry(0.05, 0.065, 1, 7, 10);
            tGeo.translate(0, 0.5, 0);
            const tp = tGeo.attributes.position;
            const tColors = new Float32Array(tp.count * 3);
            const baseC = new THREE.Color(0.42, 0.36, 0.2), tipC = new THREE.Color(0.95, 0.32, 0.55);
            for (let i = 0; i < tp.count; i++) {
                const y = tp.getY(i);
                const bulb = 1 + 0.9 * Math.exp(-Math.pow((y - 0.85) / 0.1, 2));
                const tipRound = y > 0.99 ? 0.4 : 1;
                tp.setX(i, tp.getX(i) * bulb * tipRound);
                tp.setZ(i, tp.getZ(i) * bulb * tipRound);
                const c = baseC.clone().lerp(tipC, smooth(0.3, 0.95, y));
                tColors[i * 3] = c.r;
                tColors[i * 3 + 1] = c.g;
                tColors[i * 3 + 2] = c.b;
            }
            tGeo.setAttribute('color', new THREE.BufferAttribute(tColors, 3));
            tGeo.computeVertexNormals();

            const tMat = patchMaterial(new THREE.MeshStandardMaterial({
                vertexColors: true,
                roughness: 0.4,
                emissive: 0x2a0816
            }), { sway: swayUniforms(0.22, 1.4) });

            const tentacles = new THREE.InstancedMesh(tGeo, tMat, 90);
            const dir = new THREE.Vector3(), m = new THREE.Matrix4(), q = new THREE.Quaternion();
            for (let i = 0; i < tentacles.count; i++) {
                const r = Math.sqrt(srng()) * 0.6;
                const a = srand(0, Math.PI * 2);
                const tilt = 0.2 + r * 1.6;
                dir.set(Math.cos(a) * Math.sin(tilt), Math.cos(tilt), Math.sin(a) * Math.sin(tilt)).normalize();
                q.setFromUnitVectors(UP, dir);
                m.compose(new THREE.Vector3(Math.cos(a) * r, 0.62, Math.sin(a) * r), q, new THREE.Vector3(1, srand(0.7, 1.15), 1));
                tentacles.setMatrixAt(i, m);
            }
            group.add(tentacles);
            scene.add(group);
            anemoneHome = new THREE.Vector3(x, baseY + 1.6, z);
        }

        // ------------------------------------------------------------------
        // Kelp forest: a ring fading into the fog plus a few clumps by the rocks
        // ------------------------------------------------------------------
        function makeKelpGeometry(width, twist) {
            const g = new THREE.PlaneGeometry(width, 1, 1, 24);
            g.translate(0, 0.5, 0);
            const p = g.attributes.position;
            const colors = new Float32Array(p.count * 3);
            const dark = new THREE.Color(0.06, 0.12, 0.03), light = new THREE.Color(0.38, 0.48, 0.1);
            for (let i = 0; i < p.count; i++) {
                const x = p.getX(i), y = p.getY(i);
                const w = x * (1 - 0.6 * y) * (1 + 0.18 * Math.sin(y * 31));
                const a = y * twist;
                p.setXYZ(i, w * Math.cos(a), y, w * Math.sin(a));
                const c = dark.clone().lerp(light, Math.pow(y, 0.7));
                colors[i * 3] = c.r;
                colors[i * 3 + 1] = c.g;
                colors[i * 3 + 2] = c.b;
            }
            g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            g.computeVertexNormals();
            return g;
        }

        function createKelp() {
            const geos = [makeKelpGeometry(0.35, 2.5), makeKelpGeometry(0.5, -3.5), makeKelpGeometry(0.25, 5)];
            const mat = patchMaterial(new THREE.MeshStandardMaterial({
                vertexColors: true,
                side: THREE.DoubleSide,
                roughness: 0.6
            }), { sway: swayUniforms(0.04, 0.7) });

            // One instanced draw call per blade shape
            const blades = geos.map(() => []);
            const q = new THREE.Quaternion();
            function plant(x, z, h) {
                q.setFromAxisAngle(UP, srand(0, Math.PI * 2));
                blades[Math.floor(srng() * geos.length)].push(
                    new THREE.Matrix4().compose(new THREE.Vector3(x, floorY(x, z) - 0.1, z), q, new THREE.Vector3(1, h, 1))
                );
            }

            for (let i = 0; i < 70; i++) {
                const a = srand(0, Math.PI * 2), d = srand(28, 45);
                const cx = Math.cos(a) * d, cz = Math.sin(a) * d;
                for (let j = 0; j < 3; j++) plant(cx + srand(-1.2, 1.2), cz + srand(-1.2, 1.2), srand(8, 17));
            }

            const clumps = [[-12, -9], [12.5, -8.5], [-14.5, 5], [14, 6], [4, -14], [-2, 15.5]];
            for (const [cx, cz] of clumps) {
                for (let j = 0; j < 6; j++) plant(cx + srand(-1.2, 1.2), cz + srand(-1.2, 1.2), srand(3, 8));
            }

            geos.forEach((geo, i) => {
                const kelp = new THREE.InstancedMesh(geo, mat, blades[i].length);
                blades[i].forEach((m, j) => kelp.setMatrixAt(j, m));
                kelp.frustumCulled = false;
                scene.add(kelp);
            });
        }

        // ------------------------------------------------------------------
        // Light shafts, water surface, drifting particles
        // ------------------------------------------------------------------
        function createLightShafts() {
            for (let i = 0; i < 8; i++) {
                const topR = srand(0.8, 2.2), botR = topR * srand(1.8, 2.8), h = 26;
                const geo = new THREE.CylinderGeometry(topR, botR, h, 24, 1, true);
                const mat = new THREE.ShaderMaterial({
                    uniforms: { uTime: shared.uTime, uStrength: { value: srand(0.05, 0.11) }, uSeed: { value: srand(0, 10) } },
                    vertexShader: `
                        varying vec2 vUv;
                        varying float vFacing;
                        varying float vDist;
                        void main() {
                            vUv = uv;
                            vec4 wp = modelMatrix * vec4(position, 1.0);
                            vec3 n = normalize(mat3(modelMatrix) * normal);
                            vFacing = abs(dot(n, normalize(cameraPosition - wp.xyz)));
                            vDist = distance(cameraPosition, wp.xyz);
                            gl_Position = projectionMatrix * viewMatrix * wp;
                        }
                    `,
                    fragmentShader: `
                        uniform float uTime, uStrength, uSeed;
                        varying vec2 vUv;
                        varying float vFacing;
                        varying float vDist;
                        void main() {
                            float edge = pow(vFacing, 3.0);
                            float fall = smoothstep(0.0, 1.0, vUv.y);
                            float flicker = 0.65 + 0.35 * sin(uTime * 0.6 + uSeed + vUv.y * 4.0) * sin(uTime * 0.37 + uSeed * 2.0);
                            float a = edge * fall * fall * flicker * uStrength * exp(-vDist * 0.02);
                            gl_FragColor = vec4(vec3(0.62, 0.9, 1.0) * a, 1.0);
                        }
                    `,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    side: THREE.DoubleSide
                });
                const ray = new THREE.Mesh(geo, mat);
                const a = srand(0, Math.PI * 2), d = srand(0, 16);
                ray.position.set(Math.cos(a) * d, SURFACE_Y - h / 2 + 1, Math.sin(a) * d);
                ray.userData = { baseZ: -0.2 + srand(-0.05, 0.05), baseX: -0.1 + srand(-0.05, 0.05), ph: srand(0, 10) };
                rays.push(ray);
                scene.add(ray);
            }
        }

        function createSurface() {
            const geo = new THREE.PlaneGeometry(260, 260, 1, 1);
            geo.rotateX(Math.PI / 2); // faces down into the tank
            const mat = new THREE.ShaderMaterial({
                uniforms: { uTime: shared.uTime },
                vertexShader: `
                    varying vec3 vW;
                    void main() {
                        vec4 wp = modelMatrix * vec4(position, 1.0);
                        vW = wp.xyz;
                        gl_Position = projectionMatrix * viewMatrix * wp;
                    }
                `,
                fragmentShader: `
                    uniform float uTime;
                    varying vec3 vW;
                    ${CAUSTIC_GLSL}
                    void main() {
                        float c = causticLayer(vW.xz * 0.35 - 250.0, uTime * 0.35);
                        float fade = exp(-distance(vW.xz, cameraPosition.xz) * 0.025);
                        vec3 col = vec3(0.45, 0.8, 0.95) * (0.18 + min(c, 1.5) * 0.35) * fade;
                        gl_FragColor = vec4(col, 1.0);
                    }
                `,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                side: THREE.DoubleSide
            });
            const surface = new THREE.Mesh(geo, mat);
            surface.position.y = SURFACE_Y;
            scene.add(surface);
        }

        function createMarineSnow() {
            const count = 1800;
            const positions = new Float32Array(count * 3);
            const sizes = new Float32Array(count);
            const seeds = new Float32Array(count);
            for (let i = 0; i < count; i++) {
                positions[i * 3] = rand(-32, 32);
                positions[i * 3 + 1] = rand(FLOOR_Y, SURFACE_Y);
                positions[i * 3 + 2] = rand(-32, 32);
                sizes[i] = rand(0.6, 2.2);
                seeds[i] = Math.random();
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
            geo.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 1));

            const mat = snowMaterial = new THREE.ShaderMaterial({
                uniforms: { uTime: shared.uTime, uPixelRatio: { value: renderer.getPixelRatio() } },
                vertexShader: `
                    uniform float uTime, uPixelRatio;
                    attribute float aSize, aSeed;
                    varying float vAlpha;
                    void main() {
                        vec3 p = position;
                        p.y = ${FLOOR_Y.toFixed(1)} + mod(p.y - ${FLOOR_Y.toFixed(1)} - uTime * (0.05 + aSeed * 0.12), ${(SURFACE_Y - FLOOR_Y).toFixed(1)});
                        p.x += sin(uTime * 0.2 + aSeed * 40.0) * 0.5;
                        p.z += cos(uTime * 0.17 + aSeed * 23.0) * 0.5;
                        vec4 mv = modelViewMatrix * vec4(p, 1.0);
                        gl_Position = projectionMatrix * mv;
                        float dist = -mv.z;
                        gl_PointSize = clamp(aSize * uPixelRatio * (90.0 / dist), 1.0, 48.0);
                        // Distant motes fade into the water; very close ones are big and out of focus
                        vAlpha = (1.0 - smoothstep(12.0, 45.0, dist)) * smoothstep(0.3, 1.5, dist);
                        vAlpha *= clamp(8.0 / gl_PointSize, 0.12, 1.0);
                    }
                `,
                fragmentShader: `
                    varying float vAlpha;
                    void main() {
                        float d = length(gl_PointCoord - 0.5);
                        float a = smoothstep(0.5, 0.0, d) * vAlpha * 0.55;
                        gl_FragColor = vec4(vec3(0.8, 0.92, 0.95) * a, a);
                    }
                `,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });
            const snow = new THREE.Points(geo, mat);
            snow.frustumCulled = false;
            scene.add(snow);
        }

        // ------------------------------------------------------------------
        // Bubbles: streams from an airstone and a couple of rocks
        // ------------------------------------------------------------------
        function makeBubbleTexture() {
            const S = 64;
            const c = makeCanvas(S, S);
            const ctx = c.getContext('2d');
            const g = ctx.createRadialGradient(S / 2, S / 2, S * 0.2, S / 2, S / 2, S / 2);
            g.addColorStop(0, 'rgba(255,255,255,0.05)');
            g.addColorStop(0.75, 'rgba(210,245,255,0.25)');
            g.addColorStop(0.92, 'rgba(255,255,255,0.9)');
            g.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, S, S);
            ctx.fillStyle = 'rgba(255,255,255,0.95)';
            ctx.beginPath();
            ctx.ellipse(S * 0.36, S * 0.34, S * 0.09, S * 0.06, -0.6, 0, Math.PI * 2);
            ctx.fill();
            const tex = new THREE.CanvasTexture(c);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        const bubbleMat = new THREE.SpriteMaterial({ map: makeBubbleTexture(), transparent: true, depthWrite: false, opacity: 0.85 });

        function createBubbleSources() {
            const ax = 2.8, az = -9;
            const stone = new THREE.Mesh(
                new THREE.CylinderGeometry(0.22, 0.25, 0.3, 16),
                new THREE.MeshStandardMaterial({ color: 0x6a6a6a, roughness: 1 })
            );
            stone.position.set(ax, floorY(ax, az) + 0.1, az);
            stone.castShadow = true;
            scene.add(stone);
            bubbleSources.push({ pos: new THREE.Vector3(ax, stone.position.y + 0.2, az), rate: 0.07, timer: 0, spread: 0.12 });
        }

        function spawnBubble(src) {
            if (bubbles.length > 220) return;
            const b = bubblePool.pop() || new THREE.Sprite(bubbleMat);
            const spread = src.spread ?? 0.3;
            b.position.set(src.pos.x + rand(-spread, spread), src.pos.y, src.pos.z + rand(-spread, spread));
            const size = rand(0.05, 0.15);
            b.userData = { size, vy: 0.2, ph: rand(0, 6.28), wob: rand(6, 11), y0: src.pos.y };
            b.scale.setScalar(size);
            bubbles.push(b);
            scene.add(b);
        }

        function updateBubbles(dt, t) {
            for (const s of bubbleSources) {
                s.timer -= dt;
                while (s.timer <= 0) {
                    s.timer += rand(s.rate * 0.4, s.rate * 1.6);
                    spawnBubble(s);
                }
            }
            for (let i = bubbles.length - 1; i >= 0; i--) {
                const b = bubbles[i], d = b.userData;
                const terminal = 1.0 + d.size * 12;
                d.vy += (terminal - d.vy) * damp(1.5, dt);
                b.position.y += d.vy * dt;
                b.position.x += Math.sin(t * d.wob + d.ph) * 0.35 * dt;
                b.position.z += Math.cos(t * d.wob * 0.9 + d.ph) * 0.35 * dt;
                // Bubbles grow slightly as the pressure drops
                b.scale.setScalar(d.size * (1 + (b.position.y - d.y0) * 0.02));
                if (b.position.y > SURFACE_Y - 0.2) {
                    scene.remove(b);
                    bubbles.splice(i, 1);
                    bubblePool.push(b);
                }
            }
        }

        // ------------------------------------------------------------------
        // Fish species
        //   pattern(x, h): x runs tail(-1) -> head(+1), h runs belly(-1) -> back(+1)
        //   returns [r, g, b, glow] in 0-255 sRGB
        // ------------------------------------------------------------------
        const col = (hex) => [(hex >> 16) & 255, (hex >> 8) & 255, hex & 255];
        const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
        const band = (v, c, w, soft = 0.03) => 1 - smooth(w / 2 - soft, w / 2 + soft, Math.abs(v - c));

        const SPECIES = {
            neon: {
                name: 'Neon tetra', count: 14, weight: 5,
                size: [0.45, 0.55], depth: 0.72, thick: 0.2,
                speed: 2.0, agility: 5.0, beat: 20, amp: 0.13, school: 1.6, perception: 3.0,
                sense: 9, rough: 0.4, metal: 0.05, eye: 1.35, iris: 0x9fb8c8, glow: 2.2,
                fin: { color: 0xd8e4ea, opacity: 0.22 },
                caudal: { len: 0.55, spread: 0.55, fork: 0.45 },
                dorsal: { from: 0.05, to: -0.25, h: 0.22, sweep: 0.08 },
                anal: { from: -0.1, to: -0.55, h: 0.18, sweep: 0.06 },
                pec: 0.2,
                pattern(x, h) {
                    let c = col(0xd9dde0);
                    c = mixc(c, col(0xe0283c), smooth(0.2, 0.0, x) * smooth(0.1, -0.1, h));
                    c = mixc(c, col(0x4a4638), smooth(0.38, 0.55, h));
                    const stripe = band(h, 0.24, 0.2, 0.04) * smooth(-0.75, -0.55, x) * smooth(0.95, 0.8, x);
                    c = mixc(c, col(0x2ad4ff), stripe);
                    c = mixc(c, col(0x9aa0a0), smooth(-0.7, -0.9, x) * 0.6);
                    return [...c, stripe];
                }
            },
            clown: {
                name: 'Clownfish', count: 2, weight: 1,
                size: [0.95, 1.15], depth: 1.05, thick: 0.34,
                speed: 0.8, agility: 3.0, beat: 14, amp: 0.1, school: 0, perception: 3.0,
                sense: 7, rough: 0.3, metal: 0.05, eye: 1.0, iris: 0xb86a1a,
                home: 'anemone', homeRadius: 1.4,
                fin: { color: 0xff7a1a, opacity: 0.85 },
                caudal: { len: 0.5, spread: 0.55, fork: 0.0 },
                dorsal: { from: 0.45, to: -0.62, h: 0.28, sweep: 0.1 },
                anal: { from: 0.0, to: -0.58, h: 0.24, sweep: 0.08 },
                pec: 0.3,
                pattern(x, h) {
                    let c = col(0xff7314);
                    for (const [cx, w] of [[0.5, 0.16], [-0.02 + 0.12 * h, 0.2], [-0.8, 0.09]]) {
                        const d = Math.abs(x - cx);
                        c = mixc(c, col(0x141414), 1 - smooth(w / 2 + 0.035, w / 2 + 0.06, d));
                        c = mixc(c, col(0xfbfbf5), 1 - smooth(w / 2 - 0.01, w / 2 + 0.01, d));
                    }
                    return [...c, 0];
                }
            },
            bluetang: {
                name: 'Blue tang', count: 2, weight: 1,

                speed: 1.8, agility: 2.5, beat: 9, amp: 0.1, school: 0.8, perception: 5.0,
                sense: 10, rough: 0.35, metal: 0.1, eye: 0.9, iris: 0x2a3050,

                sense: 8, rough: 0.3, metal: 0.05, eye: 1.0, iris: 0x2a2a40,
                home: 'rock', homeRadius: 3.0,
                fin: { color: 0x9b2fc9, opacity: 0.85 },
                caudal: { len: 0.5, spread: 0.6, fork: 0.1, color: 0xffc814 },
                dorsal: { from: 0.4, to: -0.7, h: 0.22, sweep: 0.1 },

            angel: {

                sense: 9, rough: 0.25, metal: 0.45, eye: 1.0, iris: 0xb03020,
                fin: { color: 0xcfd4d8, opacity: 0.55 },
                caudal: { len: 0.65, spread: 0.7, fork: 0.25 },
                dorsal: { from: 0.2, to: -0.45, h: 0.85, sweep: 0.55, tip: 1.0 },
                anal: { from: 0.1, to: -0.45, h: 0.8, sweep: 0.55, tip: 1.0 },
                pec: 0.25,
                pattern(x, h) {
                    let c = mixc(col(0xd4d8dc), col(0xc2b58a), smooth(0.2, 0.9, h) * 0.5);
                    for (const [cx, w] of [[0.6, 0.1], [0.12, 0.16], [-0.42, 0.12], [-0.85, 0.08]]) {
