        function pickSpecies() {
            const keys = Object.keys(SPECIES);
            let total = keys.reduce((s, k) => s + SPECIES[k].weight, 0);
            let r = Math.random() * total;
            for (const k of keys) {
                r -= SPECIES[k].weight;
                if (r <= 0) return k;
            }
            return keys[0];
        }

        // Body outline: slightly blunt head, tapering to a narrow tail stalk
        const bodyTaper = (x, sp) => (x < 0 ? 1 - 0.6 * Math.pow(-x, 1.3) : 1 - (0.12 + (sp.snout || 0)) * x * x);
        const bodyTop = (x, sp) => 0.42 * sp.depth * Math.sqrt(Math.max(0, 1 - x * x)) * bodyTaper(x, sp);
        // z of the body surface at (x, fraction of the height at x)
        const bodySide = (x, hFrac, sp) => {
            const s = 1 - x * x;
            return Math.sqrt(Math.max(0, s - hFrac * hFrac * s)) * sp.thick * bodyTaper(x, sp);
        };

        function makeBodyGeometry(sp) {
            const g = new THREE.SphereGeometry(1, 48, 24);
            g.rotateZ(Math.PI / 2); // poles at nose and tail
            const p = g.attributes.position, n = g.attributes.normal;
            const a = 0.42 * sp.depth, b = sp.thick;
            for (let i = 0; i < p.count; i++) {
                const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
                const t = bodyTaper(x, sp);
                p.setXYZ(i, x, y * a * t, z * b * t);
                const nx = x, ny = y / (a * t), nz = z / (b * t);
                const l = Math.hypot(nx, ny, nz) || 1;
                n.setXYZ(i, nx / l, ny / l, nz / l);
            }
            return g;
        }

        // Paint the species pattern in the sphere's UV space (u = around the body, v = along it)
        function makeFishTextures(sp) {
            const W = 128, H = 256;
            const c = makeCanvas(W, H), ctx = c.getContext('2d');
            const img = ctx.createImageData(W, H);
            let gc = null, gctx = null, gimg = null;
            if (sp.glow) {
                gc = makeCanvas(W, H);
                gctx = gc.getContext('2d');
                gimg = gctx.createImageData(W, H);
            }
            for (let row = 0; row < H; row++) {
                const x = -Math.cos(Math.PI * (row + 0.5) / H);
                for (let colI = 0; colI < W; colI++) {
                    const h = -Math.cos(2 * Math.PI * (colI + 0.5) / W);
                    const [r, g, b, glow] = sp.pattern(x, h);
                    const shade = (1 - 0.1 * h) * (0.95 + 0.1 * Math.random());
                    const i = (row * W + colI) * 4;
                    img.data[i] = clamp(r * shade, 0, 255);
                    img.data[i + 1] = clamp(g * shade, 0, 255);
                    img.data[i + 2] = clamp(b * shade, 0, 255);
                    img.data[i + 3] = 255;
                    if (gimg) {
                        gimg.data[i] = r * glow;
                        gimg.data[i + 1] = g * glow;
                        gimg.data[i + 2] = b * glow;
                        gimg.data[i + 3] = 255;
                    }
                }
            }
            ctx.putImageData(img, 0, 0);
            const tex = canvasTexture(c);
            tex.wrapT = THREE.ClampToEdgeWrapping;
            let glowTex = null;
            if (gctx) {
                gctx.putImageData(gimg, 0, 0);
                glowTex = canvasTexture(gc);
            }
            return { tex, glowTex };
        }

        // Overlapping scales, used as a bump map on every fish
        const scaleTex = (() => {
            const W = 256, H = 256, cols = 40, rows = 56;
            const c = makeCanvas(W, H), ctx = c.getContext('2d');
            ctx.fillStyle = '#808080';
            ctx.fillRect(0, 0, W, H);
            const cw = W / cols, rh = H / rows;
            for (let r = 0; r < rows + 1; r++) {
                for (let k = -1; k < cols + 1; k++) {
                    const x = (k + (r % 2) * 0.5) * cw, y = r * rh;
                    const g = ctx.createRadialGradient(x, y, 0, x, y, cw * 0.75);
                    g.addColorStop(0, '#b0b0b0');
                    g.addColorStop(0.8, '#707070');
                    g.addColorStop(1, '#505050');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(x, y, cw * 0.75, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        })();

        // Fin ray textures: a fan for the tail, slanted rays for dorsal/anal/pectoral fins
        function makeRayTexture(fan) {
            const S = 128;
            const c = makeCanvas(S, S), ctx = c.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, S, S);
            ctx.strokeStyle = 'rgba(0,0,0,0.28)';
            ctx.lineWidth = 1.6;
            if (fan) {
                for (let i = 0; i < 20; i++) {
                    ctx.beginPath();
                    ctx.moveTo(S, S / 2);
                    ctx.lineTo(0, (i / 19) * S);
                    ctx.stroke();
                }
            } else {
                for (let i = 0; i < 22; i++) {
                    const x0 = (i / 21) * S * 1.3;
                    ctx.beginPath();
                    ctx.moveTo(x0, S);
                    ctx.lineTo(x0 - 45, 0);
                    ctx.stroke();
                }
            }
            const tex = canvasTexture(c);
            tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
            return tex;
        }
        const fanTex = makeRayTexture(true);
        const rayTex = makeRayTexture(false);

        function planarUV(geo, flipV = false) {
            geo.computeBoundingBox();
            const b = geo.boundingBox, p = geo.attributes.position, uv = geo.attributes.uv;
            const w = b.max.x - b.min.x || 1, h = b.max.y - b.min.y || 1;
            for (let i = 0; i < p.count; i++) {
                const u = (p.getX(i) - b.min.x) / w, v = (p.getY(i) - b.min.y) / h;
                uv.setXY(i, u, flipV ? 1 - v : v);
            }
            return geo;
        }

        // Dorsal (side = 1) or anal (side = -1) fin whose base follows the body curve
        function makeFinGeometry(sp, f, side) {
            const s = new THREE.Shape();
            const edge = (x) => side * bodyTop(x, sp) * 0.82;
            const tip = f.tip ?? 0.45;
            s.moveTo(f.from, edge(f.from));
            for (let i = 1; i <= 10; i++) {
                const x = f.from + (f.to - f.from) * (i / 10);
                s.lineTo(x, edge(x));
            }
            const tipX = f.to - f.sweep, tipY = edge(f.to) + side * f.h * tip;
            s.quadraticCurveTo(f.to - f.sweep * 0.4, edge(f.to) + side * f.h * 0.15, tipX, tipY);
            const peakX = f.from - (f.from - f.to) * 0.3;
            s.quadraticCurveTo(peakX, edge(peakX) + side * f.h * 1.35, f.from, edge(f.from));
            return planarUV(new THREE.ShapeGeometry(s, 10), side < 0);
        }

        function makeCaudalGeometry(sp) {
            const c = sp.caudal;
            const xr = -0.9, r = bodyTop(xr, sp) * 0.9;
            const tipY = c.len * c.spread;
            const s = new THREE.Shape();
            s.moveTo(xr + 0.06, r);
            s.quadraticCurveTo(xr - c.len * 0.45, r + tipY * 0.3, xr - c.len, tipY);
            s.quadraticCurveTo(xr - c.len * (1.12 - c.fork * 0.8), tipY * 0.4, xr - c.len * (1 - c.fork), 0);
            s.quadraticCurveTo(xr - c.len * (1.12 - c.fork * 0.8), -tipY * 0.4, xr - c.len, -tipY);
            s.quadraticCurveTo(xr - c.len * 0.45, -r - tipY * 0.3, xr + 0.06, -r);
            s.closePath();
            return planarUV(new THREE.ShapeGeometry(s, 10));
        }

        function makePecGeometry(len) {
            const s = new THREE.Shape();
            s.moveTo(0, 0.03);
            s.quadraticCurveTo(-len * 0.4, len * 0.45, -len, len * 0.2);
            s.quadraticCurveTo(-len * 0.8, -len * 0.25, 0, -0.03);
            s.closePath();
            return planarUV(new THREE.ShapeGeometry(s, 8));
        }

        const pupilMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.05, metalness: 0.1 });
        const kits = {};

        // Everything that is identical for all fish of a species
        function fishKit(key) {
            if (kits[key]) return kits[key];
            const sp = SPECIES[key];
            const { tex, glowTex } = makeFishTextures(sp);

            const ex = 0.62, hf = 0.3, er = 0.085 * sp.eye;
            const ey = bodyTop(ex, sp) * hf, ez = bodySide(ex, hf, sp);
            const irises = [], pupils = [];
            for (const side of [1, -1]) {
                const iris = new THREE.SphereGeometry(er, 16, 12);
                iris.scale(1, 1, 0.45);
                iris.translate(ex, ey, side * (ez + er * 0.08));
                irises.push(iris);
                const pupil = new THREE.SphereGeometry(er * 0.6, 12, 10);
                pupil.scale(1, 1, 0.55);
                pupil.translate(ex, ey, side * (ez + er * 0.3));
                pupils.push(pupil);
            }

            const px = 0.32, phf = -0.3;
            kits[key] = {
                tex, glowTex,
                body: makeBodyGeometry(sp),
                fins: mergeGeometries([makeFinGeometry(sp, sp.dorsal, 1), makeFinGeometry(sp, sp.anal, -1)]),
                caudal: makeCaudalGeometry(sp),
                pec: makePecGeometry(sp.pec),
                pecPos: new THREE.Vector3(px, bodyTop(px, sp) * phf, bodySide(px, phf, sp)),
                irises: mergeGeometries(irises),
                pupils: mergeGeometries(pupils),
                irisMat: new THREE.MeshStandardMaterial({ color: sp.iris, roughness: 0.3, metalness: 0.4 }),
                pecMat: new THREE.MeshStandardMaterial({
                    color: sp.pecColor ?? sp.fin.color, map: rayTex, transparent: true,
                    opacity: Math.min(sp.fin.opacity, 0.7), side: THREE.DoubleSide, depthWrite: false, roughness: 0.5
                })
            };
            return kits[key];
        }

        function finMaterial(color, opacity, map, swim) {
            return patchMaterial(new THREE.MeshStandardMaterial({
                color, map, transparent: true, opacity,
                side: THREE.DoubleSide, depthWrite: false, roughness: 0.45
            }), { swim });
        }

        function addFish(key) {
            if (fishes.length >= MAX.fish) return;
            key = key || pickSpecies();
            const sp = SPECIES[key];
            const kit = fishKit(key);
            const size = rand(sp.size[0], sp.size[1]);

            // Per-fish uniforms drive the body wave in the shader
            const swim = { uSwimPhase: { value: rand(0, 6.28) }, uSwimAmp: { value: sp.amp }, uBend: { value: 0 } };

            const bodyMat = patchMaterial(new THREE.MeshStandardMaterial({
                map: kit.tex,
                bumpMap: scaleTex,
                bumpScale: 0.25,
                roughness: sp.rough,
                metalness: sp.metal,
                ...(kit.glowTex ? { emissive: 0xffffff, emissiveMap: kit.glowTex, emissiveIntensity: sp.glow } : {})
            }), { swim, caustics: 0.35 });

            const group = new THREE.Group();
            const body = new THREE.Mesh(kit.body, bodyMat);
            body.castShadow = true;
            group.add(body);
            group.add(new THREE.Mesh(kit.fins, finMaterial(sp.fin.color, sp.fin.opacity, rayTex, swim)));
            group.add(new THREE.Mesh(kit.caudal, finMaterial(sp.caudal.color ?? sp.fin.color, sp.fin.opacity, fanTex, swim)));
            group.add(new THREE.Mesh(kit.irises, kit.irisMat));
            group.add(new THREE.Mesh(kit.pupils, pupilMat));

            const pecR = new THREE.Mesh(kit.pec, kit.pecMat);
            pecR.position.copy(kit.pecPos);
            group.add(pecR);
            const pecL = new THREE.Mesh(kit.pec, kit.pecMat);
            pecL.position.copy(kit.pecPos).setZ(-kit.pecPos.z);
            group.add(pecL);

            group.scale.setScalar(FISH_L * size);

            let home = null;
            if (sp.home === 'anemone') home = anemoneHome;
            else if (sp.home === 'rock') {
                const o = obstacles[Math.floor(Math.random() * Math.min(obstacles.length, 17))];
                home = o.c.clone().add(new THREE.Vector3(0, o.r * 0.6 + 1, 0));
            }

            if (home) {
                group.position.copy(home).add(new THREE.Vector3(rand(-1, 1), rand(-0.5, 0.5), rand(-1, 1)));
            } else {
                group.position.set(rand(-12, 12), rand(-4, 5), rand(-12, 12));
            }

            const cruise = sp.speed * rand(0.85, 1.15);
            const velocity = new THREE.Vector3(rand(-1, 1), rand(-0.1, 0.1), rand(-1, 1)).setLength(cruise);
            group.userData = {
                sp, size, swim, velocity, cruise, pecR, pecL, home,
                yaw: Math.atan2(velocity.z, velocity.x),
                turn: 0,
                w1: rand(0, 100), w2: rand(0, 100), w3: rand(0, 100)
            };

            fishes.push(group);
            scene.add(group);
            refreshButtons();
        }

        // ------------------------------------------------------------------
        // Fish behaviour: flocking with their own species, feeding, avoidance
        // ------------------------------------------------------------------
        const _acc = new THREE.Vector3(), _des = new THREE.Vector3(), _tmp = new THREE.Vector3();
        const _sep = new THREE.Vector3(), _ali = new THREE.Vector3(), _coh = new THREE.Vector3();
        const _fwd = new THREE.Vector3(), _side = new THREE.Vector3(), _up = new THREE.Vector3();
        const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _qRoll = new THREE.Quaternion();

        // Steer towards a desired velocity, limited to maxForce
        function steer(vel, desired, maxForce, weight = 1) {
            _tmp.subVectors(desired, vel);
            if (_tmp.lengthSq() > maxForce * maxForce) _tmp.setLength(maxForce);
            _acc.addScaledVector(_tmp, weight);
        }

        function updateFish(fish, dt, t) {
            const d = fish.userData, sp = d.sp, pos = fish.position, vel = d.velocity;
            const F = sp.agility;
            _acc.set(0, 0, 0);

            // Food beats everything else
            let target = null, best = sp.sense * sp.sense;
            for (const f of food) {
                if (f.userData.landed || f.position.y < TANK.yMin - 0.5) continue;
                const ds = pos.distanceToSquared(f.position);
                if (ds < best) { best = ds; target = f; }
            }

            if (target) {
                _des.subVectors(target.position, pos).setLength(d.cruise * 1.8);
                steer(vel, _des, F * 3);
                const reach = 0.25 * d.size + 0.2;
                if (best < reach * reach) removeFood(target);
            } else {
                _sep.set(0, 0, 0); _ali.set(0, 0, 0); _coh.set(0, 0, 0);
                let n = 0;
                const pr2 = sp.perception * sp.perception;
                for (const o of fishes) {
                    if (o === fish) continue;
                    const od = o.userData;
                    const ds = pos.distanceToSquared(o.position);
                    const personal = (d.size + od.size) * FISH_L * 1.3;
                    if (ds < personal * personal && ds > 1e-6) {
                        _tmp.subVectors(pos, o.position).divideScalar(ds);
                        _sep.add(_tmp);
                    }
                    if (od.sp === sp && ds < pr2) {
                        _ali.add(od.velocity);
                        _coh.add(o.position);
                        n++;
                    }
                }
                if (_sep.lengthSq() > 0) {
                    _des.copy(_sep).setLength(d.cruise);
                    steer(vel, _des, F, 1.8);
                }
                if (n > 0 && sp.school > 0) {
                    if (_ali.lengthSq() > 1e-6) {
                        _des.copy(_ali).setLength(d.cruise);
                        steer(vel, _des, F, sp.school);
                    }
                    _coh.divideScalar(n).sub(pos);
                    if (_coh.lengthSq() > 1e-6) {
                        _des.copy(_coh).setLength(d.cruise);
                        steer(vel, _des, F, sp.school * 0.8);
                    }
                }

                if (d.home) {
                    _tmp.subVectors(d.home, pos);
                    const dist = _tmp.length();
                    if (dist > sp.homeRadius) {
                        _des.copy(_tmp).setLength(d.cruise);
                        steer(vel, _des, F, 1.5 * Math.min(1, (dist - sp.homeRadius) / 2));
                    }
                }

                // Gentle meander so nothing swims on rails
                _acc.x += Math.sin(t * 0.31 + d.w1) * F * 0.35;
                _acc.y += Math.sin(t * 0.23 + d.w2) * F * 0.12;
                _acc.z += Math.cos(t * 0.27 + d.w3) * F * 0.35;

                // Keep roughly to a cruising speed that drifts over time
                if (vel.lengthSq() > 1e-6) {
                    _des.copy(vel).setLength(d.cruise * (0.8 + 0.4 * Math.sin(t * 0.2 + d.w2)));
                    steer(vel, _des, F * 0.5);
                }
            }

            // Soft tank walls
            const m = 3, k = F * 0.8;
            if (pos.x > TANK.x - m) _acc.x -= (pos.x - (TANK.x - m)) * k;
            if (pos.x < -TANK.x + m) _acc.x += (-TANK.x + m - pos.x) * k;
            if (pos.z > TANK.z - m) _acc.z -= (pos.z - (TANK.z - m)) * k;
            if (pos.z < -TANK.z + m) _acc.z += (-TANK.z + m - pos.z) * k;
            if (pos.y > TANK.yMax - 1.5) _acc.y -= (pos.y - (TANK.yMax - 1.5)) * k * 2;
            if (pos.y < TANK.yMin + 1.5) _acc.y += (TANK.yMin + 1.5 - pos.y) * k * 2;

            // Rocks, corals and jellyfish
            for (const o of obstacles) {
                _tmp.subVectors(pos, o.c);
                const ds = _tmp.lengthSq(), R = o.r + 0.8;
                if (ds < R * R) {
                    const dd = Math.sqrt(ds) || 0.01;
                    _acc.addScaledVector(_tmp, ((R - dd) / dd) * F * 2);
                }
            }
            for (const j of jellyfishes) {
                _tmp.subVectors(pos, j.position);
                const ds = _tmp.lengthSq(), R = 2.2 * j.userData.size;
                if (ds < R * R) {
                    const dd = Math.sqrt(ds) || 0.01;
                    _acc.addScaledVector(_tmp, ((R - dd) / dd) * F * 1.5);
                }
            }

            vel.addScaledVector(_acc, dt);
            vel.y *= Math.exp(-dt * 1.2); // fish prefer to swim level
            const maxS = d.cruise * (target ? 1.9 : 1.4);
            if (vel.lengthSq() > maxS * maxS) vel.setLength(maxS);
            pos.addScaledVector(vel, dt);
            pos.x = clamp(pos.x, -TANK.x - 1, TANK.x + 1);
            pos.z = clamp(pos.z, -TANK.z - 1, TANK.z + 1);
            pos.y = clamp(pos.y, TANK.yMin - 0.8, TANK.yMax + 0.5);

            // Face the direction of travel, stay upright, bank into turns
            const spd = vel.length();
            const ratio = spd / sp.speed;
            if (spd > 1e-3) {
                _fwd.copy(vel).divideScalar(spd);
                _fwd.y = clamp(_fwd.y, -0.5, 0.5);
                _fwd.normalize();
                const yaw = Math.atan2(_fwd.z, _fwd.x);
                const turnRate = wrapAngle(yaw - d.yaw) / dt;
                d.yaw = yaw;
                d.turn += (clamp(turnRate, -6, 6) - d.turn) * damp(5, dt);

                _side.crossVectors(_fwd, UP).normalize();
                _up.crossVectors(_side, _fwd);
                _m4.makeBasis(_fwd, _up, _side);
                _q.setFromRotationMatrix(_m4);
                _qRoll.setFromAxisAngle(X_AXIS, clamp(d.turn * 0.12, -0.45, 0.45));
                _q.multiply(_qRoll);
                fish.quaternion.slerp(_q, damp(7, dt));
            }

            // Tail beat speeds up with swimming speed
            const sw = d.swim;
            sw.uSwimPhase.value += dt * sp.beat * (0.45 + 0.75 * Math.min(ratio, 2));
            const ampTarget = sp.amp * (0.5 + 0.7 * Math.min(ratio, 1.8)) + (target ? 0.03 : 0);
            sw.uSwimAmp.value += (ampTarget - sw.uSwimAmp.value) * damp(4, dt);
            sw.uBend.value = clamp(d.turn * 0.03, -0.1, 0.1);

            // Pectoral fins scull harder when hovering
            const flap = Math.sin(sw.uSwimPhase.value * 0.5 + 1.0) * (0.25 + 0.35 * clamp(1.2 - ratio, 0, 1));
            d.pecR.rotation.y = 0.75 + flap;
            d.pecL.rotation.y = -0.75 - flap;
        }

        // ------------------------------------------------------------------
        // Crabs
        // ------------------------------------------------------------------
        const crabKit = (() => {
            const mat = patchMaterial(new THREE.MeshStandardMaterial({ color: 0xb4462a, roughness: 0.55 }), { caustics: 0.5 });
            const body = new THREE.SphereGeometry(0.5, 20, 14);
            body.scale(0.8, 0.4, 1.4);
            return {
                mat,
                body,
                stalk: new THREE.CylinderGeometry(0.02, 0.02, 0.2),
                eye: new THREE.SphereGeometry(0.05, 8, 8),
                eyeMat: new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.1 }),
                clawArm: new THREE.CylinderGeometry(0.08, 0.08, 0.3, 8),
                clawPincer: new THREE.ConeGeometry(0.1, 0.3, 8),
                leg: new THREE.CylinderGeometry(0.03, 0.03, 0.4, 8)
            };
        })();

        function addCrab() {
            if (crabs.length >= MAX.crabs) return;
            const k = crabKit;
            const crabGroup = new THREE.Group();

            const body = new THREE.Mesh(k.body, k.mat);
            body.position.y = 0.2;
            body.castShadow = true;
            crabGroup.add(body);

            for (const side of [1, -1]) {
                const stalk = new THREE.Mesh(k.stalk, k.mat);
                stalk.position.set(0.3, 0.4, 0.2 * side);
                stalk.rotation.z = -Math.PI / 6;
                const eye = new THREE.Mesh(k.eye, k.eyeMat);
                eye.position.set(0, 0.1, 0);
                stalk.add(eye);
                crabGroup.add(stalk);
            }

            const pincers = [];
            for (const side of [1, -1]) {
                const claw = new THREE.Group();
                claw.position.set(0.4, 0.2, 0.6 * side);
                const arm = new THREE.Mesh(k.clawArm, k.mat);
                arm.rotation.x = Math.PI / 2;
                arm.rotation.y = side * Math.PI / 4;
                const pincer = new THREE.Mesh(k.clawPincer, k.mat);
                pincer.position.set(0.15, 0, 0.15 * side);
                pincer.rotation.x = side * Math.PI / 2;
                pincer.rotation.z = -Math.PI / 4;
                claw.add(arm);
                claw.add(pincer);
                crabGroup.add(claw);
                pincers.push(claw);
            }

            const legsGroup = new THREE.Group();
            for (let i = 0; i < 4; i++) {
                const xOffset = 0.2 - i * 0.2;
                const legR = new THREE.Mesh(k.leg, k.mat);
                legR.position.set(xOffset, 0.15, 0.6);
                legsGroup.add(legR);
                const legL = new THREE.Mesh(k.leg, k.mat);
                legL.position.set(xOffset, 0.15, -0.6);
                legsGroup.add(legL);
            }
            crabGroup.add(legsGroup);

            const x = rand(-14, 14), z = rand(-14, 14);
            crabGroup.position.set(x, floorY(x, z), z);
            const size = rand(0.5, 0.8);
            crabGroup.scale.setScalar(size);
            crabGroup.rotation.y = rand(0, Math.PI * 2);

            crabGroup.userData = {
                speed: rand(0.5, 1.0),
                legsGroup, pincers,
                targetRot: crabGroup.rotation.y,
                dir: Math.random() > 0.5 ? 1 : -1,
                walking: true,
                timer: rand(1, 4),
                gait: rand(0, 6),
                snap: 0,
                size
            };

            crabs.push(crabGroup);
            scene.add(crabGroup);
            refreshButtons();
        }

        function updateCrab(crab, dt, t) {
            const d = crab.userData, pos = crab.position;
            d.timer -= dt;

            // Scavenge food that has settled on the sand
            let target = null, best = 100;
            for (const f of food) {
                if (!f.userData.landed) continue;
                const dx = f.position.x - pos.x, dz = f.position.z - pos.z;
                const ds = dx * dx + dz * dz;
                if (ds < best) { best = ds; target = f; }
            }

            if (target) {
                // Our sideways walking direction is (-sin r, -cos r) * dir
                d.dir = 1;
                d.walking = true;
                d.targetRot = Math.atan2(-(target.position.x - pos.x), -(target.position.z - pos.z));
                if (best < 0.35 * 0.35) {
                    removeFood(target);
                    d.snap = 0.8;
                }
            } else if (d.timer <= 0) {
                const r = Math.random();
                if (r < 0.35) d.walking = false;
                else if (r < 0.7) { d.walking = true; d.dir *= -1; }
                else { d.walking = true; d.targetRot = rand(-Math.PI, Math.PI); }
                d.timer = rand(1.5, 4.5);
            }

            // Turn back towards the middle at the edges or when bumping a rock
            const bound = 18;
            if (Math.abs(pos.x) > bound || Math.abs(pos.z) > bound) {
                d.dir = 1;
                d.walking = true;
                d.targetRot = Math.atan2(pos.x, pos.z);
            }
            for (const o of obstacles) {
                const dx = pos.x - o.c.x, dz = pos.z - o.c.z;
                if (dx * dx + dz * dz < o.r * o.r) {
                    d.dir = 1;
                    d.targetRot = Math.atan2(-dx, -dz);
                }
            }

            crab.rotation.y += wrapAngle(d.targetRot - crab.rotation.y) * damp(3, dt);

            if (d.walking) {
                const r = crab.rotation.y;
                pos.x += -Math.sin(r) * d.dir * d.speed * dt;
                pos.z += -Math.cos(r) * d.dir * d.speed * dt;
                d.gait += dt * d.speed * 14;
            }
            pos.y = floorY(pos.x, pos.z);

            d.legsGroup.children.forEach((leg, i) => {
                const isRight = i % 2 === 0;
                const legIndex = Math.floor(i / 2);
                const baseRotX = isRight ? Math.PI / 3 : -Math.PI / 3;
                const baseRotZ = (Math.PI / 12) * (1.5 - legIndex);
                const phase = d.gait + (legIndex % 2 === 0 ? 0 : Math.PI);
                leg.rotation.z = baseRotZ + Math.sin(phase) * 0.15;
                leg.rotation.x = baseRotX + Math.cos(phase) * 0.1 * (isRight ? -1 : 1);
            });

            if (d.snap > 0) d.snap -= dt;
            const snap = d.snap > 0 ? Math.sin(t * 30) * 0.3 : Math.sin(t * 0.7 + d.gait) * 0.05;
            d.pincers[0].rotation.y = snap;
            d.pincers[1].rotation.y = -snap;
        }

        // ------------------------------------------------------------------
        // Jellyfish (moon jelly style)
        // ------------------------------------------------------------------
        const jellyKit = (() => {
            const pts = [];
            for (let i = 0; i <= 16; i++) {
                const a = (i / 16) * Math.PI * 0.5;
                pts.push(new THREE.Vector2(Math.sin(a) * 0.62, Math.cos(a) * 0.36 + 0.02));
            }
            pts.push(new THREE.Vector2(0.6, -0.03), new THREE.Vector2(0.54, -0.05));
            const bell = new THREE.LatheGeometry(pts, 48);
            // Scalloped rim
            const p = bell.attributes.position;
            for (let i = 0; i < p.count; i++) {
                const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
                if (y < 0.12) {
                    const f = 1 + 0.035 * Math.sin(Math.atan2(z, x) * 16) * smooth(0.12, 0.0, y);
                    p.setX(i, x * f);
                    p.setZ(i, z * f);
                }
            }

            const arm = new THREE.PlaneGeometry(0.16, 1, 1, 20);
            arm.translate(0, -0.5, 0);
            const ap = arm.attributes.position;
            for (let i = 0; i < ap.count; i++) {
                const y = ap.getY(i);
                ap.setX(i, ap.getX(i) * (1 + 0.6 * Math.sin(y * 22)) * (1 + y * 0.5));
            }

            const tentacle = new THREE.CylinderGeometry(0.008, 0.003, 1, 4, 16, true);
            tentacle.translate(0, -0.5, 0);

            return {
                bell, arm, tentacle,
                gonad: new THREE.TorusGeometry(0.12, 0.028, 8, 24, Math.PI * 1.5),
                gonadMat: new THREE.MeshStandardMaterial({
                    color: 0xe07aa8, emissive: 0x501830, transparent: true, opacity: 0.8, roughness: 0.4, depthWrite: false
                }),
                mats: {}
            };
        })();

        function jellyMaterials(color) {
            if (jellyKit.mats[color]) return jellyKit.mats[color];
            const common = { color, emissive: color, transparent: true, side: THREE.DoubleSide, depthWrite: false };
            jellyKit.mats[color] = {
                bell: new THREE.MeshStandardMaterial({ ...common, emissiveIntensity: 0.12, opacity: 0.32, roughness: 0.15 }),
                arm: patchMaterial(new THREE.MeshStandardMaterial({ ...common, emissiveIntensity: 0.15, opacity: 0.35, roughness: 0.4 }),
                    { sway: swayUniforms(0.08, 1.2, -1) }),
                tentacle: patchMaterial(new THREE.MeshStandardMaterial({ ...common, emissiveIntensity: 0.2, opacity: 0.3, roughness: 0.5 }),
                    { sway: swayUniforms(0.1, 1.6, -1) })
            };
            return jellyKit.mats[color];
        }

        function addJellyfish() {
            if (jellyfishes.length >= MAX.jellies) return;
            const k = jellyKit;
            const colors = [0xcfe8ff, 0xffb0e6, 0x9ff5ff];
            const mats = jellyMaterials(colors[Math.floor(Math.random() * colors.length)]);

            const group = new THREE.Group();
            const bellGroup = new THREE.Group();
            group.add(bellGroup);

            const bell = new THREE.Mesh(k.bell, mats.bell);
            bell.renderOrder = 2;
            bellGroup.add(bell);

            for (let i = 0; i < 4; i++) {
                const g = new THREE.Mesh(k.gonad, k.gonadMat);
                g.rotation.x = -Math.PI / 2;
                g.rotation.z = (i / 4) * Math.PI * 2;
                g.position.set(Math.cos(i * Math.PI / 2 + 0.8) * 0.2, 0.12, Math.sin(i * Math.PI / 2 + 0.8) * 0.2);
                bellGroup.add(g);
            }

            const tentacles = new THREE.InstancedMesh(k.tentacle, mats.tentacle, 28);
            const m = new THREE.Matrix4(), q = new THREE.Quaternion();
            for (let i = 0; i < tentacles.count; i++) {
                const a = (i / tentacles.count) * Math.PI * 2;
                m.compose(new THREE.Vector3(Math.cos(a) * 0.58, -0.03, Math.sin(a) * 0.58), q, new THREE.Vector3(1, rand(1.2, 2.6), 1));
                tentacles.setMatrixAt(i, m);
            }
            tentacles.frustumCulled = false;
            bellGroup.add(tentacles);

            for (let i = 0; i < 4; i++) {
                const arm = new THREE.Mesh(k.arm, mats.arm);
                arm.rotation.y = (i / 4) * Math.PI * 2;
                arm.position.set(Math.cos(i * Math.PI / 2) * 0.06, -0.02, Math.sin(i * Math.PI / 2) * 0.06);
                arm.scale.y = rand(1.1, 1.8);
                group.add(arm);
            }

            const size = rand(0.8, 1.5);
            group.scale.setScalar(size);
            group.position.set(rand(-12, 12), rand(-2, 5), rand(-12, 12));
            group.userData = {
                size, bellGroup,
                velocity: new THREE.Vector3(),
                pulse: rand(0, 1),
                rate: rand(0.35, 0.55),
                drift: rand(0, 100)
            };

            jellyfishes.push(group);
            scene.add(group);
            refreshButtons();
        }

        function updateJelly(jelly, dt, t) {
            const d = jelly.userData, pos = jelly.position, vel = d.velocity;
            d.pulse = (d.pulse + dt * d.rate) % 1;

            // Quick contraction, slow relaxation
            const p = d.pulse;
            const c = p < 0.28 ? Math.sin((p / 0.28) * Math.PI / 2) : Math.cos(((p - 0.28) / 0.72) * Math.PI / 2);
            d.bellGroup.scale.set(1 - 0.18 * c, 1 + 0.08 * c, 1 - 0.18 * c);

            // Each contraction pushes it up; between pulses it slowly sinks
            let thrust = p < 0.28 ? 1.6 : 0;
            if (pos.y > TANK.yMax - 1) thrust *= 0.2;
            if (pos.y < TANK.yMin + 2) thrust *= 1.8;
            vel.y += (thrust - 0.25) * dt;
            vel.x += Math.sin(t * 0.1 + d.drift) * 0.08 * dt;
            vel.z += Math.cos(t * 0.13 + d.drift) * 0.08 * dt;

            const edge = 14;
            if (Math.abs(pos.x) > edge) vel.x -= Math.sign(pos.x) * 0.3 * dt;
            if (Math.abs(pos.z) > edge) vel.z -= Math.sign(pos.z) * 0.3 * dt;

            vel.multiplyScalar(Math.exp(-dt * 0.9));
            pos.addScaledVector(vel, dt);
            pos.y = clamp(pos.y, TANK.yMin, TANK.yMax);

            // Lean slightly into the direction of drift
            jelly.rotation.z = clamp(-vel.x * 0.6, -0.3, 0.3);
            jelly.rotation.x = clamp(vel.z * 0.6, -0.3, 0.3);
        }

        // ------------------------------------------------------------------
        // Food flakes
        // ------------------------------------------------------------------
        const flakeGeo = (() => {
            const g = new THREE.CircleGeometry(0.09, 5);
            const p = g.attributes.position;
            for (let i = 1; i < p.count; i++) {
                const f = rand(0.6, 1.2);
                p.setXY(i, p.getX(i) * f, p.getY(i) * f);
            }
            return g;
        })();
        const flakeMats = [0xd9772b, 0xc9a04a, 0x8a9a3a, 0xb8452a].map(
            (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.8, side: THREE.DoubleSide })
        );

        const raycaster = new THREE.Raycaster();
        const _ndc = new THREE.Vector2(), _plane = new THREE.Plane(), _hit = new THREE.Vector3(), _camDir = new THREE.Vector3();

        function dropFood(clientX, clientY) {
            _ndc.set((clientX / window.innerWidth) * 2 - 1, -(clientY / window.innerHeight) * 2 + 1);
            raycaster.setFromCamera(_ndc, camera);
            // A plane through the tank centre facing the camera works from any viewing angle
            camera.getWorldDirection(_camDir);
            _plane.setFromNormalAndCoplanarPoint(_camDir.negate(), new THREE.Vector3(0, 0, 0));
            if (!raycaster.ray.intersectPlane(_plane, _hit)) return;
            _hit.x = clamp(_hit.x, -TANK.x + 1, TANK.x - 1);
            _hit.z = clamp(_hit.z, -TANK.z + 1, TANK.z - 1);
            _hit.y = clamp(_hit.y, TANK.yMin + 1, TANK.yMax);

            for (let i = 0; i < 6; i++) {
                const f = new THREE.Mesh(flakeGeo, flakeMats[Math.floor(Math.random() * flakeMats.length)]);
                f.position.copy(_hit).add(new THREE.Vector3(rand(-0.5, 0.5), rand(-0.3, 0.3), rand(-0.5, 0.5)));
                f.rotation.set(rand(0, 6), rand(0, 6), rand(0, 6));
                f.userData = { vy: -rand(0.3, 0.55), ph: rand(0, 6.28), spin: rand(-2, 2), landed: false, life: 30 };
                food.push(f);
                scene.add(f);
            }
        }

        function removeFood(f) {
            const i = food.indexOf(f);
            if (i !== -1) food.splice(i, 1);
            scene.remove(f);
        }

        function updateFood(dt, t) {
            for (let i = food.length - 1; i >= 0; i--) {
                const f = food[i], u = f.userData;
                if (!u.landed) {
                    // Flakes flutter as they sink
                    f.position.y += u.vy * dt;
                    f.position.x += Math.sin(t * 2.5 + u.ph) * 0.15 * dt;
                    f.position.z += Math.cos(t * 2.1 + u.ph) * 0.15 * dt;
                    f.rotation.x += u.spin * dt;
                    f.rotation.z += u.spin * 0.7 * dt;
                    const fy = floorY(f.position.x, f.position.z) + 0.03;
                    if (f.position.y <= fy) {
                        f.position.y = fy;
                        f.rotation.set(-Math.PI / 2, 0, rand(0, 6.28));
                        u.landed = true;
                    }
                } else {
                    u.life -= dt;
                    if (u.life <= 0) removeFood(f);
                }
            }
        }

        // ------------------------------------------------------------------
        // Post-processing: gentle bloom and a lens vignette
        // ------------------------------------------------------------------
        function setupPostProcessing() {
            const size = renderer.getDrawingBufferSize(new THREE.Vector2());
            const target = new THREE.WebGLRenderTarget(size.x, size.y, { type: THREE.HalfFloatType, samples: 4 });
            composer = new EffectComposer(renderer, target);
            composer.addPass(new RenderPass(scene, camera));
            bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.35, 0.5, 0.85);
            composer.addPass(bloomPass);
            composer.addPass(new ShaderPass({
                uniforms: { tDiffuse: { value: null } },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform sampler2D tDiffuse;
                    varying vec2 vUv;
                    void main() {
                        vec4 c = texture2D(tDiffuse, vUv);
                        float d = distance(vUv, vec2(0.5));
                        c.rgb *= mix(1.0, 0.5, smoothstep(0.35, 0.85, d));
                        gl_FragColor = c;
                    }
                `
            }));
            composer.addPass(new OutputPass());
        }

        // ------------------------------------------------------------------
        // Input: pointer drag to orbit, wheel/pinch to zoom, tap to feed
        // ------------------------------------------------------------------
        function setupInput() {
            const el = renderer.domElement;
            const pointers = new Map();
            let pinchDist = 0, dragged = false, downX = 0, downY = 0;

            const touch = () => { cam.lastInteract = clock.elapsedTime; };
            const pinchSpan = () => {
                const [a, b] = [...pointers.values()];
                return Math.hypot(a.x - b.x, a.y - b.y);
            };

            el.addEventListener('pointerdown', (e) => {
                el.setPointerCapture(e.pointerId);
                pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                if (pointers.size === 1) {
                    dragged = false;
                    downX = e.clientX;
                    downY = e.clientY;
                } else if (pointers.size === 2) {
                    pinchDist = pinchSpan();
                    dragged = true;
                }
                touch();
            });

            el.addEventListener('pointermove', (e) => {
                const prev = pointers.get(e.pointerId);
                if (!prev) return;
                const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
                prev.x = e.clientX;
                prev.y = e.clientY;
                if (pointers.size === 1) {
                    if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) dragged = true;
                    cam.tRotY += dx * 0.005;
                    cam.tRotX += dy * 0.005;
                } else if (pointers.size === 2) {
                    const span = pinchSpan();
                    if (span > 0) cam.tDist = clamp(cam.tDist * (pinchDist / span), CAM.minDist, CAM.maxDist);
                    pinchDist = span;
                }
                touch();
            });

            const end = (e) => {
                if (!pointers.has(e.pointerId)) return;
                if (e.type === 'pointerup' && pointers.size === 1 && !dragged && feedingMode) {
                    dropFood(e.clientX, e.clientY);
                    document.getElementById('feed-msg').classList.remove('show');
                }
                pointers.delete(e.pointerId);
            };
            el.addEventListener('pointerup', end);
            el.addEventListener('pointercancel', end);

            el.addEventListener('wheel', (e) => {
                e.preventDefault();
                const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
                cam.tDist = clamp(cam.tDist * Math.exp(dy * 0.001), CAM.minDist, CAM.maxDist);
                touch();
            }, { passive: false });

            document.getElementById('add-fish').addEventListener('click', () => addFish());
            document.getElementById('add-crab').addEventListener('click', () => addCrab());
            document.getElementById('add-jelly').addEventListener('click', () => addJellyfish());
            document.getElementById('feed-btn').addEventListener('click', toggleFeedingMode);
        }

        function toggleFeedingMode() {
            feedingMode = !feedingMode;
            document.body.classList.toggle('feeding', feedingMode);
            document.getElementById('feed-btn').textContent = feedingMode ? 'Stop Feeding' : 'Feed Tank';
            document.getElementById('feed-msg').classList.toggle('show', feedingMode);
        }

        function refreshButtons() {
            const set = (id, full, what) => {
                const b = document.getElementById(id);
                b.disabled = full;
                b.title = full ? `The tank has as many ${what} as it can hold` : '';
            };
            set('add-fish', fishes.length >= MAX.fish, 'fish');
            set('add-crab', crabs.length >= MAX.crabs, 'crabs');
            set('add-jelly', jellyfishes.length >= MAX.jellies, 'jellyfish');
        }

        function updateCamera(dt, t) {
            // Drift slowly around the tank when nobody is touching it
            if (t - cam.lastInteract > 20) cam.tRotY += dt * 0.03;

            cam.dist += (cam.tDist - cam.dist) * damp(6, dt);
            // Keep the camera under the surface and above the sand
            const maxX = Math.asin(Math.min(1, CAM.maxY / cam.dist));
            const minX = -Math.asin(Math.min(1, -CAM.minY / cam.dist));
            cam.tRotX = clamp(cam.tRotX, minX, Math.min(maxX, Math.PI / 3));
            cam.rotX += (cam.tRotX - cam.rotX) * damp(6, dt);
            cam.rotY += (cam.tRotY - cam.rotY) * damp(6, dt);

            camera.position.set(
                cam.dist * Math.sin(cam.rotY) * Math.cos(cam.rotX),
                cam.dist * Math.sin(cam.rotX),
                cam.dist * Math.cos(cam.rotY) * Math.cos(cam.rotX)
            );
            camera.lookAt(0, -0.5, 0);
            bgSphere.position.copy(camera.position);
        }

        function adaptQuality(rawDt) {
            if (rawDt > 0.5) return; // tab was hidden
            quality.time += rawDt;
            if (quality.time <= 0) return; // let shaders compile first
            quality.frames++;
            if (quality.time < 2) return;
            const fps = quality.frames / quality.time;
            quality.frames = 0;
            quality.time = 0;
            if (fps >= 50) return;
            if (quality.msaa) {
                quality.msaa = false;
                for (const rt of [composer.renderTarget1, composer.renderTarget2]) {
                    rt.samples = 0;
                    rt.dispose();
                }
            } else if (bloomPass.enabled) {
                bloomPass.enabled = false;
            } else if (quality.ratio > quality.minRatio) {
                quality.ratio = Math.max(quality.minRatio, quality.ratio - 0.15);
                renderer.setPixelRatio(quality.ratio);
                composer.setPixelRatio(quality.ratio);
                snowMaterial.uniforms.uPixelRatio.value = quality.ratio;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        // ------------------------------------------------------------------
        // Main loop
        // ------------------------------------------------------------------
        function animate() {
            // Clamp so a background tab doesn't make everything jump when it returns
            const rawDt = clock.getDelta();
            const dt = Math.min(rawDt, 0.05);
            if (dt <= 0) return;
            adaptQuality(rawDt);
            const t = clock.elapsedTime;
            shared.uTime.value = t;

            updateCamera(dt, t);
            updateBubbles(dt, t);
            updateFood(dt, t);
            for (const fish of fishes) updateFish(fish, dt, t);
            for (const crab of crabs) updateCrab(crab, dt, t);
            for (const jelly of jellyfishes) updateJelly(jelly, dt, t);
            for (const ray of rays) {
                ray.rotation.z = ray.userData.baseZ + Math.sin(t * 0.07 + ray.userData.ph) * 0.04;
                ray.rotation.x = ray.userData.baseX + Math.cos(t * 0.05 + ray.userData.ph) * 0.03;
            }

            composer.render(dt);
        }

        init();
    </script>
</body>
</html>
